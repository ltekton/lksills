name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  build-macos-arm64:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Add aarch64-apple-darwin target
        run: |
          eval "$(mise env -s bash)"
          rustup target add aarch64-apple-darwin

      - name: Build
        run: |
          eval "$(mise env -s bash)"
          cargo build --release --target aarch64-apple-darwin -p lskills-cli

      - name: Rename binary
        run: |
          mv target/aarch64-apple-darwin/release/lskills \
             lskills-${{ github.ref_name }}-aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: lskills-macos-arm64
          path: lskills-${{ github.ref_name }}-aarch64-apple-darwin

  build-linux-musl:
    name: Build (Linux x86_64 musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Add x86_64-unknown-linux-musl target
        run: |
          eval "$(mise env -s bash)"
          rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: |
          eval "$(mise env -s bash)"
          cargo build --release --target x86_64-unknown-linux-musl -p lskills-cli
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Rename binary
        run: |
          mv target/x86_64-unknown-linux-musl/release/lskills \
             lskills-${{ github.ref_name }}-x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@v4
        with:
          name: lskills-linux-musl
          path: lskills-${{ github.ref_name }}-x86_64-unknown-linux-musl

  release:
    name: Create GitHub Release
    needs: [build-macos-arm64, build-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lskills-macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: lskills-linux-musl

      - name: Create release and upload assets
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            --verify-tag \
            lskills-${{ github.ref_name }}-aarch64-apple-darwin \
            lskills-${{ github.ref_name }}-x86_64-unknown-linux-musl
        env:
          GH_TOKEN: ${{ github.token }}
