[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["ltekton"]
repository = "https://github.com/ltekton/lskills"
description = "Author agent skills once and publish them natively to claude, codex, and pi."

[workspace.dependencies]
lskills-core = { path = "crates/lskills-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
walkdir = "2"
semver = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
assert_cmd = "2"
insta = { version = "1", features = ["json", "filters"] }
tempfile = "3"
predicates = "3"

[profile.release]
strip = true
